name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
          - os: macos-13
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qqmusic-api-python
      - run: python scripts/build-artifact.sh
        env:
          PYTHON: python
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload assets
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}