name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.1.0
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macos-latest is arm64 now, so the Intel leg names its label
          # explicitly. It used to say macos-13, which GitHub no longer
          # serves: that job queued until the 24h timeout and, because
          # ``release`` needs the whole matrix, every tag since v0.1.0
          # produced no assets through CI at all.
          - os: macos-14
          - os: macos-15-intel
          - os: ubuntu-latest
          - os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller qqmusic-api-python
      - run: |
          export PYTHON="$(python3 -c 'import sys; print(sys.executable)')"
          bash scripts/build-artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: Create release
        run: gh release create "$ref" --verify-tag --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload assets
        run: gh release upload "$ref" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}