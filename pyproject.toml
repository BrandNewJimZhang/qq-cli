[project]
name = "qq-cli"
version = "0.1.0"
description = "Agent-native QQ Music resolver: search / url / lyric as JSON"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["qqmusic-api-python>=0.7.2"]

[project.scripts]
qq-cli = "qq_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
